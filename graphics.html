<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA HotWheels | Broadcast Graphics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif}
#screen{position:fixed;inset:0;display:none;overflow:hidden;background:#040812}#screen.on{display:block}
.bg{position:absolute;inset:0;background:center/100% 100% no-repeat url('arena-unified.jpg')}
#screen.intermission .bg{background-image:url('intermission-art.jpg')}
#screen.intermission .stage,#screen.intermission .glow,#screen.intermission .corner{display:none}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 35%,#02061185 100%)}
.corner{position:absolute;top:31%;height:48%;width:13%;border-top:9px solid #ff6018;border-bottom:9px solid #1767c6;filter:drop-shadow(0 0 14px #ff561a);transform:skew(-27deg)}.corner.left{left:-7%}.corner.right{right:-7%;transform:skew(27deg)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:3vh 3.5vw 4vh;animation:fade .5s ease-out}@keyframes fade{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}
.brand{height:12vh;width:12vh;object-fit:contain;filter:drop-shadow(0 0 12px #ff5d16)}
.headline{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(65px,8vw,160px);font-style:italic;font-weight:900;line-height:.95;white-space:nowrap;letter-spacing:-.025em;text-shadow:0 5px 0 #141824,0 12px 24px #000;display:flex;gap:.3em}
.metal{background:linear-gradient(#fff 12%,#dce2e9 43%,#718097 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 1px #000)}.fire{color:#ff5b15;text-shadow:0 4px 0 #a62900,0 10px 17px #000}
.kicker{font-size:clamp(13px,1.3vw,24px);font-weight:900;font-style:italic;letter-spacing:.42em;text-transform:uppercase;text-shadow:0 3px 8px #000;margin:.5vh 0 3vh}
.board{display:flex;align-items:center;justify-content:center;width:100%;max-width:1760px;height:43vh;gap:1.4vw}
.team{--team:#ab1b28;position:relative;isolation:isolate;width:44%;height:100%;display:flex;align-items:center;justify-content:center;gap:1vw;padding:4% 5% 10%;filter:drop-shadow(0 12px 10px #000a)}
.team:before{content:'';position:absolute;inset:0;z-index:-2;background:linear-gradient(115deg,#fff5 0%,transparent 18%,#050914a8 85%),linear-gradient(125deg,var(--team),#0a1531);clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}
.team:after{content:'';position:absolute;inset:0;z-index:-1;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);border-top:5px solid #ff6923;background:linear-gradient(150deg,#ffffff27 1%,transparent 38%,#0006 95%)}
.team.away:before{background:linear-gradient(245deg,#fff4 0%,transparent 18%,#05091499 85%),linear-gradient(235deg,var(--team),#0a1531)}
.team img{width:75%;height:78%;object-fit:contain;filter:drop-shadow(0 6px 9px #000)}
.team-name{position:absolute;bottom:0;left:2%;height:20%;width:91%;display:flex;align-items:center;justify-content:center;padding:0 5%;background:linear-gradient(#fff,#aeb7c3);clip-path:polygon(9% 0,100% 0,91% 100%,0 100%);font:italic 900 clamp(23px,3vw,58px) Impact,'Arial Narrow',Arial,sans-serif;color:#0b0e15;text-transform:uppercase;text-align:center;overflow-wrap:anywhere}
.versus{font:italic 900 clamp(48px,5.5vw,100px) Impact,'Arial Narrow',Arial,sans-serif;text-shadow:0 5px 10px #000;color:#e9edf5}
.score{font:900 clamp(80px,8vw,155px) Impact,'Arial Narrow',Arial,sans-serif;text-shadow:0 5px 9px #000;color:#fff}
.halftime .team{width:45%;gap:1%;padding:3% 4% 9%}.halftime .team img{width:47%;height:80%}.halftime .score{width:43%;text-align:center}.halftime .versus{font-size:4vw}
.footer{margin-top:3vh;padding:1.2vh 6vw;min-width:44%;max-width:90%;background:linear-gradient(100deg,#104789,#030b20 25%,#050d22 75%,#104789);border-left:12px solid #ff6118;border-right:12px solid #ff6118;transform:skew(-12deg);text-align:center;box-shadow:0 7px 22px #000b,0 0 15px #176be455;font:italic 900 clamp(20px,2vw,40px) Impact,'Arial Narrow',Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 4px 9px #000}.footer span{display:block;transform:skew(12deg)}
.preview{position:fixed;z-index:99;top:12px;left:12px;padding:10px;background:#101e37ed;border:1px solid #7189b0;border-radius:8px;font:14px Arial,sans-serif}.preview button{margin:4px;padding:8px;border:0;border-radius:5px;background:#2458a2;color:#fff;cursor:pointer}.preview[hidden]{display:none}
@media(max-width:700px){.headline{font-size:8vw}.brand{height:9vh;width:9vh}.board{height:36vh}.team-name{font-size:3vw}.score{font-size:7vw}.footer{font-size:2.2vw}}
</style></head><body><div id="screen"><div class="bg"></div><div class="glow"></div><div class="corner left"></div><div class="corner right"></div><main class="stage" id="stage"></main></div><div class="preview" id="preview" hidden><b>LA HotWheels Preview</b><div><button onclick="test('intermission')">Intermission</button><button onclick="test('upnext')">Up Next</button><button onclick="test('halftime')">Halftime</button><button onclick="test('hidden')">Hide</button></div></div>
<script>
const params=new URLSearchParams(location.search);
const isPreview=params.get('preview')==='1';
let g={screen:'hidden',tournamentName:'LA HotWheels Basketball Tournament',hostName:'LA HotWheels',hostLogo:'',nextHome:'THE PACK',nextAway:'HOOPERS',nextHomeColor:'#aa1724',nextAwayColor:'#124a9b',nextHomeLogo:'',nextAwayLogo:'',nextTime:'NEXT GAME — COMING UP'};
let s={homeName:'THE PACK',awayName:'HOOPERS',homeScore:42,awayScore:38,homeColor:'#aa1724',awayColor:'#124a9b',homeLogo:'',awayLogo:''};
let previewMode='intermission';
function el(tag,cls,txt){const e=document.createElement(tag);e.className=cls||'';if(txt!==undefined)e.textContent=String(txt);return e}
function img(src,cls){const e=el('img',cls);e.alt='';if(typeof src==='string'&&(/^(https?:\/\/|data:image\/|\.\/?|\/)/i.test(src)||src==='hotwheels-transparent.png'))e.src=src;else e.style.display='none';e.onerror=()=>e.style.display='none';return e}
function team(name,c,logo,score,away){const t=el('div','team'+(away?' away':''));t.style.setProperty('--team',/^#[0-9a-f]{6}$/i.test(c||'')?c:(away?'#124a9b':'#aa1724'));if(logo)t.append(img(logo,'team-logo'));if(score!==null)t.append(el('div','score',Math.max(0,Number(score)||0)));t.append(el('div','team-name',name||'TEAM'));return t}
function render(){const mode=isPreview?previewMode:g.screen;const root=document.getElementById('screen');const stage=document.getElementById('stage');root.className='';stage.replaceChildren();if(!['intermission','upnext','halftime'].includes(mode))return;root.className='on '+mode;if(mode==='intermission')return;
const half=mode==='halftime';const head=el('div','headline');head.append(el('span','metal',half?'HALF':'UP'),el('span','fire',half?'TIME':'NEXT'));
const board=el('div','board');board.append(team(half?s.homeName:g.nextHome,half?s.homeColor:g.nextHomeColor,half?s.homeLogo:g.nextHomeLogo,half?s.homeScore:null,false),el('div','versus','VS'),team(half?s.awayName:g.nextAway,half?s.awayColor:g.nextAwayColor,half?s.awayLogo:g.nextAwayLogo,half?s.awayScore:null,true));
const footer=el('div','footer');footer.append(el('span','',half?'SECOND HALF COMING UP':g.nextTime||'NEXT GAME — COMING UP'));
stage.append(img(g.hostLogo||'hotwheels-transparent.png','brand'),head,el('div','kicker',g.tournamentName||'LA HOTWHEELS BASKETBALL'),board,footer)}
function test(mode){if(!isPreview)return;previewMode=mode;render()}
if(isPreview){document.getElementById('preview').hidden=false;render()}
const url=params.get('url'),key=params.get('key'),room=params.get('room')||'basketball1';
if(url&&key&&window.supabase){const client=window.supabase.createClient(url,key);const channel=client.channel('score-room-'+room,{config:{broadcast:{self:false}}});channel.on('broadcast',{event:'state'},({payload})=>{if(payload&&typeof payload==='object'){s={...s,...payload};render()}}).on('broadcast',{event:'graphics-state'},({payload})=>{if(payload&&typeof payload==='object'){g={...g,...payload};render()}}).subscribe(status=>{if(status==='SUBSCRIBED')channel.send({type:'broadcast',event:'request',payload:{room}})})}
</script></body></html>
