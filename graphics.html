<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA HotWheels | Broadcast Graphics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif}#screen{position:fixed;inset:0;display:none;overflow:hidden;background:#030815}#screen.on{display:block}#art{position:absolute;inset:0;background-size:100% 100%;background-position:center}#screen.intermission #art{background-image:url('intermission-art.jpg')}#screen.upnext #art{background-image:url('upnext-clean.jpg')}#screen.halftime #art{background-image:url('halftime-clean.jpg')}#stage{position:absolute;inset:0}#screen.intermission #stage{display:none}
.board{position:absolute;left:3.5%;right:3.5%;top:38%;height:39%;display:flex;align-items:stretch;justify-content:space-between;gap:3.4%}.panel{--team:#b71925;position:relative;isolation:isolate;width:44%;height:100%;filter:drop-shadow(0 12px 12px #000d)}.panel:before{content:"";position:absolute;inset:0;z-index:-1;clip-path:polygon(10% 0,100% 0,89% 100%,0 100%);background:linear-gradient(125deg,#ffffff6b 0%,transparent 13%,#0008 93%),linear-gradient(105deg,var(--team),#071026);box-shadow:inset 0 0 55px #0005}.panel.away:before{background:linear-gradient(235deg,#ffffff70 0%,transparent 13%,#0009 94%),linear-gradient(240deg,var(--team),#071026)}.panel:after{content:"";position:absolute;inset:0;z-index:-1;clip-path:polygon(10% 0,100% 0,89% 100%,0 100%);background:linear-gradient(160deg,#ffffff40,transparent 35%,#0008 100%);border-top:5px solid #ff7b31}.panel.away:after{border-top-color:#3da6ff}.panel .contents{position:absolute;inset:4% 6% 20%;display:flex;align-items:center;justify-content:center;gap:4%}.team-logo{max-width:72%;max-height:92%;object-fit:contain;filter:drop-shadow(0 5px 8px #000c)}.logo-placeholder{width:53%;aspect-ratio:1.2;display:flex;align-items:center;justify-content:center;flex-direction:column;border:3px solid #ff8b39;background:radial-gradient(circle,#ff812f44,#070b18 73%);border-radius:50%;font:italic 900 clamp(14px,2.7vw,54px) Impact,'Arial Narrow',sans-serif;text-align:center;text-shadow:0 4px 5px #000;transform:skew(-5deg);padding:5%;overflow:hidden}.away .logo-placeholder{border-color:#53a5ff}.logo-placeholder:before{content:'🏀';font-size:2.3vw;display:block}.score{font:900 clamp(45px,6.8vw,150px) Impact,'Arial Narrow',Arial,sans-serif;color:#f6f8ff;text-shadow:0 5px 0 #4e5768,0 10px 12px #000;line-height:1}.nameplate{position:absolute;left:4%;right:8%;bottom:0;height:20%;clip-path:polygon(8% 0,100% 0,91% 100%,0 100%);background:linear-gradient(#fff,#e2e6eb 48%,#9aa4b2);display:flex;align-items:center;justify-content:center;color:#090b12;font:italic 900 clamp(17px,3vw,61px) Impact,'Arial Narrow',Arial,sans-serif;text-transform:uppercase;text-align:center;padding:0 7%;overflow-wrap:anywhere}.vs{position:absolute;left:44%;width:12%;top:40%;text-align:center;font:italic 900 clamp(35px,5.4vw,110px) Impact,'Arial Narrow',sans-serif;background:linear-gradient(#fff,#aeb8c9);background-clip:text;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 5px 5px #000);z-index:3}.halftime .panel .contents{inset:5% 5% 20%;justify-content:space-around}.halftime .team-logo{max-width:46%}.halftime .logo-placeholder{width:45%;font-size:2vw}.halftime .score{font-size:6.3vw}.halftime .board{top:39%;height:38%}.footer{position:absolute;left:25%;right:25%;top:81%;height:9%;display:flex;align-items:center;justify-content:center;text-align:center;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);background:linear-gradient(100deg,#f76b19 0 3%,#124f9b 4%,#040d29 24%,#071534 76%,#135aa6 96%,#f86b19 97%);border-top:3px solid #49aaff;border-bottom:3px solid #fa6d1a;font:italic 900 clamp(14px,2vw,40px) Impact,'Arial Narrow',Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;text-shadow:0 3px 7px #000;white-space:nowrap;padding:0 3%}.preview{position:fixed;z-index:50;left:10px;top:10px;padding:10px;background:#081831ed;border:1px solid #7c9bc3;border-radius:8px;font:14px Arial,sans-serif}.preview button{margin:3px;padding:9px;border:0;border-radius:5px;color:#fff;background:#1956a5;cursor:pointer}.preview[hidden]{display:none}
</style></head><body><div id="screen"><div id="art"></div><div id="stage"></div></div><div class="preview" id="preview" hidden><b>LA HotWheels — Preview</b><div><button onclick="test('intermission')">Intermission</button><button onclick="test('upnext')">Up Next</button><button onclick="test('halftime')">Halftime</button><button onclick="test('hidden')">Hide</button></div></div><script>
const p=new URLSearchParams(location.search),isPreview=p.get('preview')==='1';
let g={screen:'hidden',nextHome:'THE PACK',nextAway:'HOOPERS',nextHomeColor:'#ad1026',nextAwayColor:'#1254b9',nextHomeLogo:'',nextAwayLogo:'',nextTime:'NEXT GAME — COMING UP'};
let s={homeName:'THE PACK',awayName:'HOOPERS',homeScore:42,awayScore:38,homeColor:'#ad1026',awayColor:'#1254b9',homeLogo:'',awayLogo:''};
let previewMode='intermission';
function el(tag,cls,txt){const e=document.createElement(tag);e.className=cls||'';if(txt!==undefined)e.textContent=String(txt);return e}
function panel(name,clr,logo,points,away){const e=el('div','panel'+(away?' away':''));e.style.setProperty('--team',/^#[0-9a-f]{6}$/i.test(clr||'')?clr:(away?'#1254b9':'#ad1026'));const c=el('div','contents');if(typeof logo==='string'&&/^(https?:\/\/|data:image\/|\/|\.\/)/i.test(logo)){const i=el('img','team-logo');i.src=logo;i.alt=name||'Team logo';i.onerror=()=>{i.replaceWith(el('div','logo-placeholder',name||'TEAM'))};c.append(i)}else c.append(el('div','logo-placeholder',name||'TEAM'));if(points!==null)c.append(el('div','score',String(Math.max(0,Number(points)||0))));e.append(c,el('div','nameplate',name||'TEAM'));return e}
function render(){const mode=isPreview?previewMode:g.screen,root=document.getElementById('screen'),stage=document.getElementById('stage');stage.replaceChildren();root.className='';if(!['intermission','upnext','halftime'].includes(mode))return;root.className='on '+mode;if(mode==='intermission')return;const half=mode==='halftime',board=el('div','board');board.append(panel(half?s.homeName:g.nextHome,half?s.homeColor:g.nextHomeColor,half?s.homeLogo:g.nextHomeLogo,half?s.homeScore:null,false),el('div','vs','VS'),panel(half?s.awayName:g.nextAway,half?s.awayColor:g.nextAwayColor,half?s.awayLogo:g.nextAwayLogo,half?s.awayScore:null,true));stage.append(board,el('div','footer',half?'SECOND HALF COMING UP':g.nextTime||'NEXT GAME — COMING UP'))}
function test(mode){if(!isPreview)return;previewMode=mode;render()}
if(isPreview){document.getElementById('preview').hidden=false;render()}
const url=p.get('url'),key=p.get('key'),room=p.get('room')||'basketball1';if(url&&key&&window.supabase){const client=window.supabase.createClient(url,key),channel=client.channel('score-room-'+room,{config:{broadcast:{self:false}}});channel.on('broadcast',{event:'state'},({payload})=>{if(payload&&typeof payload==='object'){s={...s,...payload};render()}}).on('broadcast',{event:'graphics-state'},({payload})=>{if(payload&&typeof payload==='object'){g={...g,...payload};render()}}).subscribe(status=>{if(status==='SUBSCRIBED')channel.send({type:'broadcast',event:'request',payload:{room}})})}
</script></body></html>
