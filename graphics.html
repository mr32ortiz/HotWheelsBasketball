<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA HotWheels Broadcast Graphics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Arial,Helvetica,sans-serif}#screen{display:none;position:fixed;inset:0;overflow:hidden;background:#03060d}#screen.on{display:block}.art{position:absolute;inset:0;background:center/100% 100% no-repeat url('arena-art.jpg')}#screen.intermission .art{background-image:url('intermission-art.jpg')}.screen-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.3vh;animation:arrive .65s ease both}#screen.intermission .screen-content{display:none}@keyframes arrive{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}.vignette{position:absolute;inset:0;background:linear-gradient(90deg,#02040b70,transparent 20%,transparent 80%,#02040b70),linear-gradient(0deg,#03040b9e,transparent 20%,transparent 82%,#03040b91)}.orange-rail{position:absolute;left:0;right:0;top:0;height:1.1vh;background:linear-gradient(90deg,#ff5414 0 17%,#143a87 17% 32%,transparent 32% 68%,#143a87 68% 83%,#ff5414 83%);box-shadow:0 0 25px #ff5a24aa}.bottom-rail{position:absolute;bottom:0;left:0;right:0;height:1.2vh;background:linear-gradient(90deg,#ff5b1c,#133a89,#ff5b1c)}.header{display:flex;align-items:center;justify-content:center;gap:1.4vw;margin-bottom:1vh;filter:drop-shadow(0 6px 7px #000)}.host-logo{width:clamp(58px,7vw,135px);height:clamp(58px,7vw,135px);object-fit:contain;mix-blend-mode:screen}.host-name{font-size:clamp(20px,2.1vw,40px);font-weight:1000;letter-spacing:.23em;text-transform:uppercase}.tournament{font-size:clamp(12px,1.15vw,22px);letter-spacing:.38em;font-weight:900;text-transform:uppercase;text-shadow:0 3px 9px black}.headline{display:flex;justify-content:center;align-items:baseline;gap:1.2vw;font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(70px,8.5vw,166px);font-weight:1000;font-style:italic;line-height:.9;letter-spacing:-.025em;text-transform:uppercase;text-shadow:0 5px 2px #333,0 12px 24px #000}.headline .silver{background:linear-gradient(#fff,#cbd2db 55%,#6d788c);color:transparent;background-clip:text}.headline .hot{color:#ff5719;text-shadow:0 4px 0 #872500,0 9px 22px #000}.match{display:flex;align-items:stretch;justify-content:center;gap:1vw;width:89%;height:39vh;max-height:460px}.team{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1vh;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%);background:linear-gradient(130deg,var(--team) 0%,color-mix(in srgb,var(--team),#050914 65%) 58%,#030711 100%);border-top:solid .7vh #f5f6ff;box-shadow:inset 0 0 80px #000}.team.away{clip-path:polygon(0 0,91% 0,100% 100%,9% 100%)}.team:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#ffffff20 45%,transparent 65%)}.team-logo{width:clamp(55px,11vw,210px);height:clamp(55px,11vw,210px);object-fit:contain;filter:drop-shadow(0 8px 8px #000a)}.team-name{font-family:Impact,'Arial Narrow',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;text-shadow:0 4px 8px #000;line-height:1.05;font-size:clamp(25px,3.4vw,65px);max-width:88%;overflow-wrap:anywhere}.score{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(70px,7.5vw,145px);line-height:1;text-shadow:0 5px 12px black;font-variant-numeric:tabular-nums}.vs{align-self:center;font:italic 900 clamp(45px,5vw,90px) Impact,'Arial Narrow',sans-serif;text-shadow:0 0 22px #ff591c,0 4px 10px black}.ribbon{background:linear-gradient(110deg,#0c2659,#050913 35%,#0b1c42 80%,#ff5719);padding:1.3vh 5vw;border-left:1.1vw solid #ff5719;border-right:1.1vw solid #154ba4;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);font-size:clamp(19px,2.2vw,43px);font-weight:900;letter-spacing:.12em;text-transform:uppercase;text-align:center;max-width:85%;text-shadow:0 4px 8px black}.preview-controls{position:fixed;z-index:999;left:12px;top:12px;background:#0d1931e8;padding:12px;border:1px solid #7c8daa;border-radius:9px;font:14px Arial}.preview-controls button{margin:4px;padding:9px;color:white;background:#234b86;border:0;border-radius:5px;cursor:pointer}.preview-controls[hidden]{display:none}
</style></head><body><div id="screen"><div class="art"></div><div class="vignette"></div><div class="orange-rail"></div><div class="bottom-rail"></div><main class="screen-content" id="content"></main></div><div class="preview-controls" id="preview" hidden><b>LA HotWheels Preview</b><div><button onclick="test('intermission')">Intermission</button><button onclick="test('upnext')">Up Next</button><button onclick="test('halftime')">Halftime</button><button onclick="test('hidden')">Hide</button></div></div><script>
const p=new URLSearchParams(location.search),isPreview=p.get('preview')==='1';
let g={screen:'hidden',tournamentName:'LA HotWheels Basketball Tournament',hostName:'LA HotWheels',hostColor:'#ff5816',hostLogo:'',nextHome:'THE PACK',nextAway:'HOOPERS',nextHomeColor:'#aa1724',nextAwayColor:'#124a9b',nextHomeLogo:'',nextAwayLogo:'',nextTime:'NEXT GAME — COMING UP'};
let s={homeName:'THE PACK',awayName:'HOOPERS',homeScore:42,awayScore:38,homeColor:'#aa1724',awayColor:'#124a9b',homeLogo:'',awayLogo:'',quarter:'Q2'};
function el(tag,cls,txt){const e=document.createElement(tag);e.className=cls||'';if(txt!==undefined)e.textContent=String(txt);return e}
function img(url,cls){const e=el('img',cls);e.alt='';if(typeof url==='string'&&(/^(https?:\/\/|data:image\/|\.\/)/i.test(url)||url==='hotwheels.jpg'))e.src=url;else e.style.display='none';e.onerror=()=>e.style.display='none';return e}
function color(c,f){return /^#[\da-f]{6}$/i.test(c||'')?c:f}
function team(name,c,logo,score,away){const t=el('div','team'+(away?' away':''));t.style.setProperty('--team',color(c,away?'#16478f':'#ac1a25'));t.append(img(logo,'team-logo'),el('div','team-name',name||'TEAM'));if(score!==null)t.append(el('div','score',Math.max(0,Number(score)||0)));return t}
function render(){const mode=isPreview?previewMode:g.screen,root=document.getElementById('screen'),content=document.getElementById('content');root.className='';if(!['intermission','upnext','halftime'].includes(mode)){content.replaceChildren();return}root.className='on '+mode;if(mode==='intermission'){content.replaceChildren();return}const header=el('div','header');header.append(img(g.hostLogo||'hotwheels.jpg','host-logo'),el('div','host-name',g.hostName||'LA HotWheels'));const title=el('div','headline');title.append(el('span','silver',mode==='upnext'?'UP':'HALF'),el('span','hot',mode==='upnext'?'NEXT':'TIME'));const match=el('div','match');const half=mode==='halftime';match.append(team(half?s.homeName:g.nextHome,half?s.homeColor:g.nextHomeColor,half?s.homeLogo:g.nextHomeLogo,half?s.homeScore:null,false),el('div','vs','VS'),team(half?s.awayName:g.nextAway,half?s.awayColor:g.nextAwayColor,half?s.awayLogo:g.nextAwayLogo,half?s.awayScore:null,true));content.replaceChildren(header,el('div','tournament',g.tournamentName),title,match,el('div','ribbon',half?'SECOND HALF COMING UP':g.nextTime||'COMING UP NEXT'))}
let previewMode='intermission';function test(mode){previewMode=mode;render()}if(isPreview){document.getElementById('preview').hidden=false;render()}
const url=p.get('url'),key=p.get('key'),room=p.get('room')||'basketball1';if(url&&key&&window.supabase){const client=window.supabase.createClient(url,key),channel=client.channel('score-room-'+room,{config:{broadcast:{self:false}}});channel.on('broadcast',{event:'state'},({payload})=>{if(payload&&typeof payload==='object'){s={...s,...payload};render()}}).on('broadcast',{event:'graphics-state'},({payload})=>{if(payload&&typeof payload==='object'){g={...g,...payload};render()}}).subscribe(status=>{if(status==='SUBSCRIBED')channel.send({type:'broadcast',event:'request',payload:{room}})})}
</script></body></html>
