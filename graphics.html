<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA HotWheels | Broadcast Graphics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif}#screen{position:fixed;inset:0;display:none;overflow:hidden;background:#04070d;isolation:isolate}#screen.on{display:block}#screen .bg{position:absolute;inset:0;background:center/cover no-repeat url('upnext-arena.jpg');z-index:-3}#screen.halftime .bg{background-image:url('halftime-arena.jpg')}#screen.intermission .bg{background-image:url('intermission-art.jpg');background-size:100% 100%}#screen.intermission .stage{display:none}#screen.intermission .shade{display:none}.shade{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 40%,#05081220 0%,#03060dbb 82%),linear-gradient(0deg,#03060d8a,transparent 35%,#03060d85)}.slash{position:absolute;width:22vw;height:170vh;top:-40vh;transform:rotate(36deg);border-left:2.4vw solid #ff5214;border-right:2vw solid #0b2f7a;filter:drop-shadow(0 0 12px #ff521466);opacity:.72;z-index:-1}.slash.left{left:-18vw}.slash.right{right:-18vw;transform:rotate(-36deg)}.floor{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(0deg,#6a280b70,transparent);border-top:2px solid #ff5b18a0;z-index:-1}.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4.2vh 4.5vw 4vh;gap:0;animation:enter .65s ease-out both}@keyframes enter{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}.mast{display:flex;justify-content:center;align-items:center;gap:1.2vw;height:12vh}.mast img{height:11vh;width:11vh;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 0 10px #ff541855)}.headline{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-style:italic;font-weight:1000;font-size:clamp(66px,8.3vw,158px);letter-spacing:-.025em;line-height:1;white-space:nowrap;text-shadow:0 5px 0 #111724,0 12px 18px #000}.metal{background:linear-gradient(180deg,#fff 15%,#d5dbe3 46%,#788697 95%);color:transparent;-webkit-background-clip:text;background-clip:text}.fire{color:#ff571a;text-shadow:0 4px 0 #a32602,0 12px 20px #000}.kicker{font-style:italic;letter-spacing:.5em;font-weight:900;font-size:clamp(12px,1.4vw,27px);text-transform:uppercase;text-shadow:0 4px 9px #000;margin:.2vh 0 2.5vh}.board{width:100%;max-width:1760px;display:flex;align-items:center;justify-content:center;position:relative;gap:0}.upnext .board{height:46vh}.halftime .board{height:39vh}.team{height:100%;width:44%;position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1vh;filter:drop-shadow(0 8px 10px #000b)}.team:before{content:"";position:absolute;inset:0;z-index:-2;clip-path:polygon(11% 0,100% 0,89% 100%,0 100%);background:linear-gradient(115deg,var(--team) 0%,color-mix(in srgb,var(--team),#000 48%) 40%,#050a16 100%);border-top:4px solid #ff5317}.team.away:before{clip-path:polygon(11% 0,100% 0,89% 100%,0 100%);background:linear-gradient(110deg,#05132b 0%,color-mix(in srgb,var(--team),#000 25%) 75%,var(--team) 100%)}.team:after{content:"";position:absolute;inset:0;z-index:-1;clip-path:polygon(11% 0,100% 0,89% 100%,0 100%);background:linear-gradient(115deg,#ffffff30,transparent 24%,#ffffff12 40%,transparent 58%)}.team img{height:57%;width:60%;object-fit:contain;filter:drop-shadow(0 5px 10px #000);z-index:1}.team img[style*="display: none"]{height:0}.team .team-name{position:absolute;bottom:0;left:1%;width:91%;height:20%;display:flex;align-items:center;justify-content:center;padding:0 3%;background:linear-gradient(#fff,#b9c0cb);color:#080a11;clip-path:polygon(11% 0,100% 0,89% 100%,0 100%);font:italic 900 clamp(22px,3.2vw,61px) Impact,'Arial Narrow',Arial,sans-serif;text-transform:uppercase;text-shadow:0 1px 0 #fff;overflow-wrap:anywhere;text-align:center}.team.away .team-name{left:1%}.versus{width:12%;text-align:center;font:italic 900 clamp(43px,5.5vw,105px) Impact,'Arial Narrow',Arial,sans-serif;background:linear-gradient(#fff,#8f9ba9);color:transparent;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 3px #000);z-index:2}.score{font:900 clamp(60px,8vw,152px) Impact,'Arial Narrow',Arial,sans-serif;line-height:1;text-shadow:0 4px 10px #000}.halftime .team{width:46%;flex-direction:row;padding-bottom:8%;gap:2%}.halftime .team img{height:70%;width:40%}.halftime .score{width:32%;text-align:center}.halftime .team .team-name{height:21%;font-size:clamp(19px,2.7vw,52px)}.halftime .versus{width:8%;font-size:clamp(33px,4vw,80px)}.footer{position:relative;min-width:45%;max-width:85%;margin-top:3vh;padding:1.6vh 5vw;background:linear-gradient(100deg,#123979,#020711 27%,#050b1b 76%,#143f89);clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);border-left:1vw solid #ff5719;box-shadow:0 7px 25px #000;text-align:center;font:italic 900 clamp(18px,2.25vw,43px) Impact,'Arial Narrow',Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 4px 8px #000}.footer::before{content:"";position:absolute;top:0;bottom:0;left:8%;width:1vw;transform:skew(-24deg);background:#ff5719}.halftime .footer{margin-top:5vh}.preview{position:fixed;top:12px;left:12px;z-index:99;padding:12px;border-radius:9px;background:#101e37ee;border:1px solid #8295b5;font:14px Arial}.preview button{border:0;background:#234e8e;color:white;padding:9px;border-radius:5px;margin:4px;cursor:pointer}.preview[hidden]{display:none}@media(max-width:700px){.stage{padding-top:8vh}.mast{height:10vh}.headline{font-size:9vw}.board{margin-top:3vh}.upnext .board{height:35vh}.halftime .board{height:32vh}.team .team-name{font-size:3.2vw}.footer{font-size:2.5vw}}
</style></head><body><div id="screen"><div class="bg"></div><div class="shade"></div><div class="slash left"></div><div class="slash right"></div><div class="floor"></div><main class="stage" id="stage"></main></div><div class="preview" id="preview" hidden><strong>LA HotWheels — Preview</strong><div><button onclick="test('intermission')">Intermission</button><button onclick="test('upnext')">Up Next</button><button onclick="test('halftime')">Halftime</button><button onclick="test('hidden')">Hide</button></div></div><script>
const p=new URLSearchParams(location.search),isPreview=p.get('preview')==='1';
let g={screen:'hidden',tournamentName:'LA HotWheels Basketball Tournament',hostName:'LA HotWheels',hostColor:'#ff5816',hostLogo:'',nextHome:'THE PACK',nextAway:'HOOPERS',nextHomeColor:'#aa1724',nextAwayColor:'#124a9b',nextHomeLogo:'',nextAwayLogo:'',nextTime:'NEXT GAME — COMING UP'};
let s={homeName:'THE PACK',awayName:'HOOPERS',homeScore:42,awayScore:38,homeColor:'#aa1724',awayColor:'#124a9b',homeLogo:'',awayLogo:'',quarter:'Q2'};
function el(tag,cls,txt){const e=document.createElement(tag);e.className=cls||'';if(txt!==undefined)e.textContent=String(txt);return e}
function img(url,cls){const e=el('img',cls);e.alt='';if(typeof url==='string'&&(/^(https?:\/\/|data:image\/|\.\/)/i.test(url)||url==='hotwheels.jpg'))e.src=url;else e.style.display='none';e.onerror=()=>e.style.display='none';return e}
function color(c,f){return /^#[\da-f]{6}$/i.test(c||'')?c:f}
function team(name,c,logo,points,away){const t=el('div','team'+(away?' away':''));t.style.setProperty('--team',color(c,away?'#124a9b':'#aa1724'));t.append(img(logo,'team-logo'));if(points!==null)t.append(el('div','score',Math.max(0,Number(points)||0)));t.append(el('div','team-name',name||'TEAM'));return t}
let previewMode='intermission';
function render(){const mode=isPreview?previewMode:g.screen,root=document.getElementById('screen'),stage=document.getElementById('stage');root.className='';if(!['intermission','upnext','halftime'].includes(mode)){stage.replaceChildren();return}root.className='on '+mode;if(mode==='intermission'){stage.replaceChildren();return}const mast=el('div','mast');mast.append(img(g.hostLogo||'hotwheels.jpg','host-logo'));const head=el('div','headline');head.append(el('span','metal',mode==='upnext'?'UP ':'HALF'),el('span','fire',mode==='upnext'?'NEXT':'TIME'));mast.append(head);const half=mode==='halftime',board=el('div','board');board.append(team(half?s.homeName:g.nextHome,half?s.homeColor:g.nextHomeColor,half?s.homeLogo:g.nextHomeLogo,half?s.homeScore:null,false),el('div','versus','VS'),team(half?s.awayName:g.nextAway,half?s.awayColor:g.nextAwayColor,half?s.awayLogo:g.nextAwayLogo,half?s.awayScore:null,true));stage.replaceChildren(mast,el('div','kicker',g.tournamentName||'LA HOTWHEELS TOURNAMENT'),board,el('div','footer',half?'SECOND HALF COMING UP':g.nextTime||'COMING UP NEXT'))}
function test(mode){if(!isPreview)return;previewMode=mode;render()}
if(isPreview){document.getElementById('preview').hidden=false;render()}
const url=p.get('url'),key=p.get('key'),room=p.get('room')||'basketball1';if(url&&key&&window.supabase){const client=window.supabase.createClient(url,key),channel=client.channel('score-room-'+room,{config:{broadcast:{self:false}}});channel.on('broadcast',{event:'state'},({payload})=>{if(payload&&typeof payload==='object'){s={...s,...payload};render()}}).on('broadcast',{event:'graphics-state'},({payload})=>{if(payload&&typeof payload==='object'){g={...g,...payload};render()}}).subscribe(status=>{if(status==='SUBSCRIBED')channel.send({type:'broadcast',event:'request',payload:{room}})}}
</script></body></html>
